name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: STATIC_EXPORT=1 npm run build
        env:
          NODE_ENV: production
          # Served from the ROOT of the custom domain (reconnect.health), so no
          # NEXT_PUBLIC_BASE_PATH — assets resolve from "/".
          # Google Apps Script Web App that records form submissions to the
          # leads sheet (public by nature — NEXT_PUBLIC_* is exposed client-side).
          NEXT_PUBLIC_LEADS_ENDPOINT: https://script.google.com/macros/s/AKfycbweC7RwlimNZiVs-iH2GFLjl4eVt5vLnrpGpdrWYkedyQ9DXpm0Rgq-1sZ9xBDNKeMy/exec
          # Public booking API ORIGIN (no /v1/api — lib/booking.ts appends the path).
          # Points at staging; the booking flow goes live once the backend deploys
          # the public/appointment/* routes there and allows the reconnect.health origin.
          NEXT_PUBLIC_API_BASE: https://stage.reconnect.health

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
